name: CI

# Run on PRs into main and pushes to main; skip docs-only changes to save Actions minutes.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']

# Least privilege: nothing here writes back to the repo.
permissions:
  contents: read

# A newer push/PR-update supersedes an in-flight run on the same ref (except on main).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    name: gate (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pnpm 11 requires Node >=22.13 (uses node:sqlite); Node 20 is EOL. Test Active LTS + current.
        node: [22, 24]
    steps:
      # Actions are SHA-pinned (supply chain); comment shows the tag.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # ESM-first: load the built packages by name under both import + require.
      - run: pnpm smoke
